<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMERYA | PS4 HOST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu">
        <h2 class="section-title">Main Menu</h2>
        
        <div class="button-grid">
            
            <!-- قائمة الإصدارات المنسدلة -->
            <div class="dropdown">
                <button class="btn btn-multi dropdown-btn" onclick="toggleDropdown()">
                    Select Firmware ▾
                </button>
                <div class="dropdown-content" id="fwDropdown">
                    <a href="g2all/index.html" onmouseover="updateMsg('GoldHEN Multi FW')">GoldHEN Multi FW</a>
                    <a href="505/index.html" onmouseover="updateMsg('5.05 FW v2.5')">5.05 FW v2.5</a>
                    <a href="672goldhen/index.html" onmouseover="updateMsg('6.72 FW GoldHEN')">6.72 FW GoldHEN</a>
                    <a href="672/index.html" onmouseover="updateMsg('6.72 FW v3.0')">6.72 FW v3.0</a>
                    <a href="900goldhen/index.html" onmouseover="updateMsg('9.00 FW GoldHEN')">9.00 FW GoldHEN</a>
                    <a href="900v3/index.html" onmouseover="updateMsg('9.00 FW v3.0')">9.00 FW v3.0</a>
                </div>
            </div>

            <!-- زر الـ Payloads -->
            <button class="btn btn-payload" onclick="location.replace('payloads.html')">
                🚀 Payloads
            </button>

            <!-- زر الاستعادة -->
            <button class="btn btn-restore" onclick="location.replace('restore/index.html')">
                Restore Host
            </button>
        </div>

        <footer class="footer">
            Designed by <span class="designer">gamewya & jafar</span> 
            <span class="thanks">Special thanks to all devs on the scene.</span>
        </footer>
    </div>

    <div class="bottom-bar">
        <span>GAMERYA HOST</span>
    </div>

    <script>
        const msgElement = document.getElementById('msgs');
        function updateMsg(text) {
            msgElement.innerHTML = text;
        }

        function toggleDropdown() {
            document.getElementById("fwDropdown").classList.toggle("show");
        }

        // إغلاق القائمة عند الضغط خارجها
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
