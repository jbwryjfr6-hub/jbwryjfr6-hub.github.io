<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMERYA | PS4 HOST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر العلوي حسب الصورة -->
    <header class="main-header">
        <div class="logo-container">
            <img src="logo.png" alt="GAMERYA LOGO" class="main-logo">
        </div>
        <div class="title-container">
            <h1 class="brand-name">GAMERYA | <span class="arabic-text">جيمريا</span></h1>
            <div class="host-badge">
                <span class="slash">///</span> PS4 HOST <span class="slash">///</span>
            </div>
        </div>
    </header>

    <!-- منطقة الرسائل التفاعلية -->
    <div id="msgs">مرحباً بك في هوست جيمريا</div>

    <!-- القائمة الرئيسية -->
    <div id="menu">
        <h2 class="section-title">Select Your Firmware</h2>
        
        <div class="button-grid">
            <button class="btn btn-multi" onmouseover="updateMsg('PS4 GoldHEN Host for 5.05 and 7.00 to 14.02 FW')" onmouseout="resetMsg()" onclick="location.replace('g2all/index.html')"> GoldHEN Multi FW </button>
            
            <button class="btn" onmouseover="updateMsg('PS4 5.05 FW Host v2.5')" onmouseout="resetMsg()" onclick="location.replace('505/index.html')"> 5.05 FW v2.5 </button>
            
            <button class="btn" onmouseover="updateMsg('PS4 6.72 FW GoldHEN Host')" onmouseout="resetMsg()" onclick="location.replace('672goldhen/index.html')"> 6.72 FW GoldHEN </button>
            
            <button class="btn" onmouseover="updateMsg('PS4 6.72 FW Host v3.0')" onmouseout="resetMsg()" onclick="location.replace('672/index.html')"> 6.72 FW v3.0 </button>
            
            <button class="btn" onmouseover="updateMsg('PS4 9.00 FW GoldHEN Host')" onmouseout="resetMsg()" onclick="location.replace('900goldhen/index.html')"> 9.00 FW GoldHEN </button>
            
            <button class="btn" onmouseover="updateMsg('PS4 9.00 FW Host v3.0')" onmouseout="resetMsg()" onclick="location.replace('900v3/index.html')"> 9.00 FW v3.0 </button>
            
            <button class="btn btn-restore" onmouseover="updateMsg('Restore a Host Guide')" onmouseout="resetMsg()" onclick="location.replace('restore/index.html')"> Restore Host </button>
        </div>

        <footer class="footer">
            Designed by <a href="https://twitter.com/GamerHack93" target="_blank">@GamerHack93</a> 
            <span class="thanks">Special thanks to all devs on the scene.</span>
        </footer>
    </div>

    <!-- شريط سفلي كما في الصورة -->
    <div class="bottom-bar">
        <span>GAMERYA HOST</span>
    </div>

    <script>
        const msgElement = document.getElementById('msgs');
        function updateMsg(text) {
            msgElement.innerHTML = text;
        }
        function resetMsg() {
            msgElement.innerHTML = 'مرحباً بك في هوست جيمريا';
        }
    </script>
</body>
</html>
